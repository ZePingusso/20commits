<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Site de Filmes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Meu Site de Filmes</h1>
        <p>Alguns dos meus filmes favoritos</p>
    </header>

    <main>

        <section class="filmes">

            <div class="filme">
                <img src="img/filme1.jpg" alt="Imagem do filme 1">
                <h2>Filme 1</h2>
                <p>Um filme muito interessante para assistir.</p>
            </div>

            <div class="filme">
                <img src="img/filme2.jpg" alt="Imagem do filme 2">
                <h2>Filme 2</h2>
                <p>Outro filme que vale a pena conhecer.</p>
            </div>

            <div class="filme">
                <img src="img/filme3.jpg" alt="Imagem do filme 3">
                <h2>Filme 3</h2>
                <p>Uma ótima opção para assistir no fim de semana.</p>
            </div>

        </section>

        <button onclick="mostrarMensagem()">Clique aqui</button>

        <p id="mensagem"></p>

    </main>

    <footer>
        <p>Meu Site - 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
